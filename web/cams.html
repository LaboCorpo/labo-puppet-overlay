<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Friends' cams</title>
<link rel="icon" href="shared/labohub.png">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
  .bg, #dim { position: absolute; inset: 0; }
  .bg { inset: -40px; }
  .bg.anim { animation: bgmove 18s ease-in-out infinite alternate; }
  @keyframes bgmove { from { background-position: 0% 30%; } to { background-position: 100% 70%; } }
  #dim { background: #000; pointer-events: none; }
  #title { position: absolute; left: 0; right: 0; top: 2.2%; text-align: center; font-weight: 900; letter-spacing: .02em; text-shadow: 0 4px 18px rgba(0,0,0,.45); }
  #logo { position: absolute; display: none; pointer-events: none; filter: drop-shadow(0 6px 18px rgba(0,0,0,.4)); }
  .tile { position: absolute; box-sizing: border-box; padding: var(--bw); background: var(--bc); border-radius: var(--rad); transition: left .5s cubic-bezier(.2,.8,.2,1), top .5s cubic-bezier(.2,.8,.2,1), width .5s cubic-bezier(.2,.8,.2,1), height .5s cubic-bezier(.2,.8,.2,1), box-shadow .3s, transform .3s; animation: tileIn .5s cubic-bezier(.2,.8,.2,1) both; }
  .tile.dragging { transition: box-shadow .3s; }
  @keyframes tileIn { from { opacity: 0; transform: scale(.85); } }
  .tile .vid { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: calc(var(--rad) - var(--bw) * .6); background: #0d0b12; }
  .tile iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .tile.glow { box-shadow: 0 10px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08); }
  .tile.speaking { box-shadow: 0 0 0 4px #fff, 0 0 40px var(--bc); transform: scale(1.015); }
  .s-rect, .s-rect .vid { border-radius: 0; }
  .s-circle, .s-circle .vid { border-radius: 50%; }
  .s-squircle, .s-squircle .vid { border-radius: 32%; }
  .s-hexagon, .s-hexagon .vid { border-radius: 0; clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); }
  .s-blob, .s-blob .vid { border-radius: 42% 58% 55% 45% / 48% 40% 60% 52%; animation: blob 12s ease-in-out infinite alternate; }
  @keyframes blob { 50% { border-radius: 58% 42% 45% 55% / 40% 58% 42% 60%; } }
  .vid.demo { display: grid; place-items: center; background: linear-gradient(135deg, #3a2a5c, #1d1528); }
  .vid.demo span { font-size: 40px; font-weight: 900; color: #fff8; }
  .name { position: absolute; left: 6%; bottom: 7%; max-width: 80%; padding: .2em .75em; border-radius: 99px; background: var(--nbg); color: var(--nfg); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 14px rgba(0,0,0,.35); pointer-events: none; }
  .s-circle .name, .s-hexagon .name, .s-blob .name { left: 50%; transform: translateX(-50%); bottom: 4%; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 22px; text-shadow: 0 2px 10px #000; text-align: center; padding: 20px; }
  .guide { position: absolute; background: #ff4fa3; pointer-events: none; z-index: 999; display: none; }
  .guide.v { width: 2px; top: 0; bottom: 0; } .guide.h { height: 2px; left: 0; right: 0; }
  /* Panel preview with editing: drag to move, the dot to resize. */
  .grab, .rs { display: none; }
  body.edit .tile iframe { pointer-events: none; }
  body.edit .grab { display: block; position: absolute; inset: 0; cursor: move; z-index: 3; border-radius: inherit; outline: 2px dashed #a970ff99; outline-offset: -2px; }
  body.edit .tile:hover .grab { outline-color: #a970ff; background: #a970ff14; }
  body.edit .rs { display: block; position: absolute; right: -6px; bottom: -6px; width: 22px; height: 22px; border-radius: 50%; background: #a970ff; border: 3px solid #14110a; cursor: nwse-resize; z-index: 6; }
  body.edit { background: repeating-conic-gradient(#1a1622 0 25%, #16131d 0 50%) 0 0 / 24px 24px; }
</style>
</head>
<body>
<div id="stage"><div id="bg" class="bg"></div><div id="dim"></div><img id="logo" alt=""><div id="title" data-no-i18n></div><div id="tiles"></div><div id="empty" data-no-i18n></div><div class="guide v" id="gv"></div><div class="guide h" id="gh"></div></div>
<script src="shared/i18n.js"></script>
<script src="cams.js"></script>
</body>
</html>
