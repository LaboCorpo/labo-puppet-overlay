<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Countdown</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; display: grid; place-items: center; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; overflow: hidden; }
  .box { text-align: center; text-shadow: 0 6px 24px rgba(0,0,0,.5); }
  .text { font-size: 6vh; font-weight: 800; letter-spacing: .04em; opacity: .92; animation: breathe 3s ease-in-out infinite; }
  .time { font-size: 18vh; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; background: linear-gradient(90deg, #a970ff, #ff4fa3, #ffc93c, #a970ff); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 6s linear infinite; }
  @keyframes flow { to { background-position: 300% 0; } }
  @keyframes breathe { 50% { transform: scale(1.04); } }
</style>
</head>
<body>
<div class="box"><div class="text" id="text"></div><div class="time" id="time">00:00</div></div>
<script>
  // countdown.html?min=5&text=Starting%20soon (&end=Here%20we%20go!)
  const q = new URLSearchParams(location.search);
  const min = Math.max(0, Math.min(600, Number(q.get('min')) || 5));
  const end = Date.now() + min * 60000;
  document.getElementById('text').textContent = (q.get('text') || 'Starting soon').slice(0, 80);
  const done = (q.get('end') || "Let's go!").slice(0, 80);
  function tick() {
    const s = Math.max(0, Math.round((end - Date.now()) / 1000));
    document.getElementById('time').textContent = s ? `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : done;
    if (s) setTimeout(tick, 250);
  }
  tick();
</script>
</body>
</html>
