<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LaboHub — overlay</title>
<link rel="icon" href="shared/labohub.png">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
  :root { --ac: #ffc93c; --bg: rgba(20, 17, 10, .86); }
  #root { position: absolute; inset: 0; padding: 14px; box-sizing: border-box; }
  .card { background: var(--bg); border: 3px solid var(--ac); border-radius: 18px; padding: 14px 18px; box-shadow: 0 12px 40px rgba(0,0,0,.45); transition: opacity .5s, transform .5s cubic-bezier(.2,.8,.2,1); max-width: 100%; box-sizing: border-box; }
  .card.hide { opacity: 0; transform: translateY(16px) scale(.97); }
  .head { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 22px; letter-spacing: .02em; }
  .head .tag { margin-left: auto; font-size: 14px; background: var(--ac); color: #1d1520; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
  .sub { color: #ffffffcc; font-weight: 700; font-size: 16px; margin-top: 4px; }
  .big { font-size: 44px; font-weight: 900; line-height: 1.1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; min-height: 30px; }
  .chip { background: #ffffff1a; border-radius: 99px; padding: 4px 10px; font-weight: 700; font-size: 14px; animation: pop .4s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  /* poll */
  .opt { position: relative; margin-top: 8px; border-radius: 10px; background: #ffffff12; overflow: hidden; }
  .opt .bar { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--ac), #ff7a45); opacity: .55; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .opt .txt { position: relative; display: flex; gap: 10px; padding: 8px 12px; font-weight: 800; font-size: 17px; }
  .opt .txt .n { color: var(--ac); } .opt .txt .p { margin-left: auto; }
  .opt.win { box-shadow: 0 0 0 3px var(--ac), 0 0 24px var(--ac); }
  .opt.win .bar { opacity: .9; }
  .timer { height: 5px; border-radius: 3px; background: #ffffff22; margin-top: 12px; overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--ac); transition: width 1s linear; }
  /* winner */
  @keyframes bump { 30% { transform: scale(1.45) rotate(-6deg); } }
  #winner { position: absolute; inset: 0; display: none; place-items: center; text-align: center; background: radial-gradient(circle, rgba(0,0,0,.55), transparent 70%); }
  #winner.on { display: grid; }
  #winner .roll { font-size: 64px; font-weight: 900; text-shadow: 0 6px 24px #000; }
  #winner .roll.final { color: var(--ac); animation: bump .7s cubic-bezier(.2,.8,.2,1); }
  #winner .lbl { font-size: 26px; font-weight: 900; letter-spacing: .08em; text-shadow: 0 4px 16px #000; }
  canvas { position: absolute; inset: 0; pointer-events: none; }
  .empty { color: #ffffff88; font-weight: 700; padding: 6px 0; }
</style>
</head>
<body>
<div id="root" data-no-i18n></div>
<div id="winner" data-no-i18n><div><div class="lbl" id="winLbl"></div><div class="roll" id="winName"></div></div></div>
<canvas id="fx"></canvas>
<script src="shared/i18n.js"></script>
<script src="lab-widget.js"></script>
</body>
</html>
